<!DOCTYPE html>
<html lang="en" data-bs-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1.0" />
  <title>Register • JobMatch AI</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
  <link href="./styles.css" rel="stylesheet">
</head>
<body>
  <nav class="navbar navbar-expand-lg navbar-light bg-white shadow-sm sticky-top">
    <div class="container">
      <a class="navbar-brand fw-bold d-flex align-items-center" href="./index.html">
        <div class="brand-logo me-2"><i class="fas fa-brain"></i></div>
        JobMatch AI
      </a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navC">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="navC">
        <ul class="navbar-nav me-auto">
          <li class="nav-item"><a class="nav-link" href="./index.html">Jobs</a></li>
          <li class="nav-item"><a class="nav-link" href="./companies.html">Companies</a></li>
          <li class="nav-item"><a class="nav-link" href="./career_advice.html">Career Advice</a></li>
          <li class="nav-item"><a class="nav-link" href="./about.html">About</a></li>
        </ul>
        <a class="btn btn-outline-primary" href="./set_skills.html"><i class="fas fa-user-cog me-1"></i>Set Skills</a>
      </div>
    </div>
  </nav>

  <section class="page-header text-center py-5">
    <div class="container">
      <h1>Create Account</h1>
      <p>Join JobMatch AI to get personalized job matches</p>
    </div>
  </section>

  <div class="container pb-5">
    <div class="login-container">
      <form class="login-form">
        <div class="form-group">
          <label for="name">Full Name</label>
          <input type="text" id="name" required placeholder="Enter your name">
        </div>
        <div class="form-group">
          <label for="email2">Email Address</label>
          <input type="email" id="email2" required placeholder="Enter your email">
        </div>
        <div class="form-group">
          <label for="password2">Password</label>
          <input type="password" id="password2" required placeholder="Create a password">
        </div>
        <button type="submit" class="login-btn">Create Account</button>
      </form>
    </div>
  </div>

  <footer class="bg-dark text-light py-4 mt-5">
    <div class="container text-center">
      <p class="mb-0">&copy; <span id="year"></span> JobMatch AI.</p>
    </div>
  </footer>

  <script>document.getElementById('year').textContent = new Date().getFullYear();</script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
