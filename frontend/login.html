<!DOCTYPE html>
<html lang="en" data-bs-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1.0" />
  <title>Login • JobMatch AI</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
  <link href="./styles.css" rel="stylesheet">
</head>
<body>
  <nav class="navbar navbar-expand-lg navbar-light bg-white shadow-sm sticky-top">
    <div class="container">
      <a class="navbar-brand fw-bold d-flex align-items-center" href="./index.html">
        <div class="brand-logo me-2"><i class="fas fa-brain"></i></div>
        JobMatch AI
      </a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navC">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="navC">
        <ul class="navbar-nav me-auto">
          <li class="nav-item"><a class="nav-link" href="./index.html">Jobs</a></li>
          <li class="nav-item"><a class="nav-link" href="./companies.html">Companies</a></li>
          <li class="nav-item"><a class="nav-link" href="./career_advice.html">Career Advice</a></li>
          <li class="nav-item"><a class="nav-link" href="./about.html">About</a></li>
        </ul>
        <a class="btn btn-outline-primary" href="./set_skills.html"><i class="fas fa-user-cog me-1"></i>Set Skills</a>
      </div>
    </div>
  </nav>

  <section class="page-header text-center py-5">
    <div class="container">
      <h1>Welcome Back</h1>
      <p>Sign in to access your JobMatch AI dashboard</p>
    </div>
  </section>

  <div class="container pb-5">
    <div class="login-container">
      <form class="login-form" id="login-form">
        <div class="form-group">
          <label for="email">Email Address</label>
          <input type="email" id="email" required placeholder="Enter your email">
        </div>

        <div class="form-group">
          <label for="password">Password</label>
          <input type="password" id="password" required placeholder="Enter your password">
        </div>

        <div class="form-options">
          <label class="checkbox-label">
            <input type="checkbox" id="remember">
            <span class="checkmark"></span>
            Remember me
          </label>
          <a href="#" class="forgot-link">Forgot password?</a>
        </div>

        <button type="submit" class="login-btn">Sign In</button>

        <div class="divider"><span>or</span></div>

        <button type="button" class="google-btn">
          <i class="fab fa-google"></i> Continue with Google
        </button>
        <button type="button" class="linkedin-btn">
          <i class="fab fa-linkedin"></i> Continue with LinkedIn
        </button>
      </form>

      <div class="signup-prompt">
        <p>Don't have an account? <a href="./register.html" class="signup-link">Create one here</a></p>
      </div>
    </div>
  </div>

  <footer class="bg-dark text-light py-4 mt-5">
    <div class="container text-center">
      <p class="mb-0">&copy; <span id="year"></span> JobMatch AI.</p>
    </div>
  </footer>

  <script>document.getElementById('year').textContent = new Date().getFullYear();</script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
