<!DOCTYPE html>
<html lang="en" data-bs-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1.0" />
  <title>Set Skills – JobMatch AI</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
  <link href="{{ url_for('static', filename='style.css') }}" rel="stylesheet">
</head>
<body>
  <!-- Navbar -->
  <nav class="navbar navbar-expand-lg navbar-light bg-white shadow-sm sticky-top">
    <div class="container">
      <a class="navbar-brand fw-bold d-flex align-items-center" href="{{ url_for('home') }}">
        <div class="brand-logo me-2"><i class="fas fa-brain"></i></div> JobMatch AI
      </a>
    </div>
  </nav>

  <main class="container py-5" style="max-width:760px;">
    <div class="card shadow-sm">
      <div class="card-body p-4 p-md-5">
        <h1 class="fw-bold mb-3">Set Your Skills</h1>
        <p class="text-muted">Enter your skills to personalize job recommendations.</p>
        <form method="post" action="/set-skills">
          <div class="mb-3">
            <label class="form-label">Skills (comma-separated)</label>
            <input name="skills" class="form-control" placeholder="e.g., Python, React, SQL">
          </div>
          <button class="btn btn-primary" type="submit">Save</button>
          <a class="btn btn-link" href="{{ url_for('home') }}">Back to Jobs</a>
        </form>
      </div>
    </div>
  </main>

  <footer class="bg-dark text-light py-4 mt-5">
    <div class="container text-center">
      <p class="mb-0">&copy; <span id="year"></span> JobMatch AI.</p>
    </div>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <script src="{{ url_for('static', filename='main.js') }}"></script>
</body>
</html>
