<!DOCTYPE html>
<html lang="en" data-bs-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1.0" />
  <title>Post a Job – JobMatch AI</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
  <link href="{{ url_for('static', filename='style.css') }}" rel="stylesheet">
</head>
<body>
  <!-- Navbar -->
  <nav class="navbar navbar-expand-lg navbar-light bg-white shadow-sm sticky-top">
    <div class="container">
      <a class="navbar-brand fw-bold d-flex align-items-center" href="{{ url_for('home') }}">
        <div class="brand-logo me-2"><i class="fas fa-brain"></i></div> JobMatch AI
      </a>
      <div class="d-flex ms-auto">
        <a class="btn btn-outline-primary" href="{{ url_for('page', page='set_skills') }}"><i class="fa-solid fa-user-cog me-1"></i>Set Skills</a>
      </div>
    </div>
  </nav>

  <main class="container py-5" style="max-width:900px;">
    <div class="mb-4">
      <h1 class="fw-bold">Post a New Job</h1>
      <p class="text-muted mb-0">Share your opening with thousands of qualified candidates.</p>
    </div>

    <div class="card shadow-sm">
      <div class="card-body p-4">
        <form id="job-form">
          <div class="row g-3">
            <div class="col-md-6">
              <label class="form-label">Title</label>
              <input type="text" name="title" class="form-control" required />
            </div>
            <div class="col-md-6">
              <label class="form-label">Company</label>
              <input type="text" name="company" class="form-control" required />
            </div>
            <div class="col-md-6">
              <label class="form-label">Location</label>
              <input type="text" name="location" class="form-control" />
            </div>
            <div class="col-12">
              <label class="form-label">Description</label>
              <textarea name="description" rows="5" class="form-control"></textarea>
            </div>
          </div>
          <button class="btn btn-primary mt-4" type="submit">Submit Job</button>
        </form>
        <p id="status" class="text-muted small mt-3" role="status"></p>
      </div>
    </div>
  </main>

  <footer class="bg-dark text-light py-4 mt-5">
    <div class="container text-center">
      <p class="mb-0">&copy; <span id="year"></span> JobMatch AI.</p>
    </div>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <script src="{{ url_for('static', filename='main.js') }}"></script>
</body>
</html>
